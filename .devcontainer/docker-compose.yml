services:
  # ── Development Container ──────────────────────────────────
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    security_opt:
      - seccomp=unconfined
    volumes:
      - ../..:/workspaces:cached
      - ha-config:/config
      - codex-data:/home/node/.codex
    command: sleep infinity
    network_mode: service:homeassistant
    depends_on:
      - homeassistant
      - frigate

  # ── Home Assistant ─────────────────────────────────────────
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.9.0
    container_name: homeassistant
    restart: unless-stopped
    privileged: true
    volumes:
      - ha-config:/config
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:8123:8123"
    depends_on:
      - frigate

  # ── Frigate NVR ────────────────────────────────────────────
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: frigate
    restart: unless-stopped
    privileged: true
    shm_size: "256mb"
    volumes:
      - ./frigate:/config
      - frigate-media:/media/frigate
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:5000:5000"   # Frigate Web UI
      - "127.0.0.1:8554:8554"   # go2rtc WebRTC
      - "127.0.0.1:8555:8555/tcp" # go2rtc WebRTC TCP
      - "127.0.0.1:8555:8555/udp" # go2rtc WebRTC UDP
      - "127.0.0.1:1984:1984"   # go2rtc API

  # ── RTSP Test Server (optional - simulates camera feeds) ──
  rtsp-test:
    image: bluenviron/mediamtx:latest
    container_name: rtsp-test
    restart: unless-stopped
    ports:
      - "127.0.0.1:8554:8554"
    profiles:
      - rtsp

volumes:
  codex-data:
    name: frigateviewcard-codex-data
  ha-config:
    name: frigateviewcard-ha-config
  frigate-media:
    name: frigateviewcard-frigate-media
